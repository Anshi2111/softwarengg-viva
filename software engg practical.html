<h2>Search Food</h2>
<input type="text" placeholder="Enter food name">
<button>Search</button>
<h2>Order Management</h2>

    <option>UPI</option>
    <option>Credit Card</option>
    <option>Cash on Delivery</option>
</select>
<button>Make Payment</button>
